name: Bug report
description: Something a11yfix did wrong (a crash, a wrong patch, a wrong verdict)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A verified patch that is wrong is the most important kind of bug: please say so in the title.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you run, what did you expect, what did you get?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal HTML to reproduce
      description: The smallest page that shows the problem. Remove anything private.
      render: html
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Command and output
      description: The exact command, and the relevant part of the output or of the verification JSON.
      render: shell
  - type: input
    id: versions
    attributes:
      label: Versions
      description: a11yfix version, Node.js version, OS (the report header lists axe-core and Playwright versions).
    validations:
      required: true
