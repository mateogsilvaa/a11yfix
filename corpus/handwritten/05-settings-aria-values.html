<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Account settings</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 42rem; margin: 2rem auto; color: #111; }
    .panel { border: 1px solid #ccc; padding: 1rem; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>Settings</h1>
    <h2 id="privacy-heading">Privacy</h2>
    <button type="button" aria-expanded="yes" aria-controls="privacy-panel">Show privacy options</button>
    <div id="privacy-panel" class="panel" aria-labelledby="privacy-heading">
      <p>Who can see your profile?</p>
    </div>
    <h2 id="notif-heading">Notifications</h2>
    <div role="switch" tabindex="0" aria-checked="1" aria-labelledby="notif-label">Email me about new comments</div>
    <span id="notifications-label" hidden>Comment emails</span>
    <h2>Danger zone</h2>
    <button type="button" aria-describedby="delete-warning" aria-pressed="0">Delete account</button>
    <p id="delete-warning">This cannot be undone.</p>
    <div aria-live="loud">Saved.</div>
    <nav>
      <a href="/settings" aria-current="active">Settings</a>
      <a href="/billing">Billing</a>
    </nav>
    <button type="button" aria-checked="false">Dark mode</button>
    <a href="/help" aria-selected="true">Help</a>
    <div aria-level="2">Advanced</div>
  </main>
</body>
</html>
