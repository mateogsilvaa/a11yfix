<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ana Ruiz - Illustration</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #111; color: #eee; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
    .grid img { width: 100%; }
    .toolbar button { background: none; border: 0; }
  </style>
</head>
<body>
  <header>
    <img src="assets/a.png" width="48">
    <div class="toolbar">
      <button type="button"><img src="assets/ic_share_24.svg"></button>
      <button type="button"><img src="assets/ic_heart_24.svg"></button>
    </div>
  </header>
  <main>
    <h1>Selected work</h1>
    <div class="grid">
      <img src="work/IMG_2041.jpg">
      <img src="work/IMG_2057.jpg">
      <img src="work/final-v3-FINAL.png">
    </div>
    <h2>Clients</h2>
    <p>
      <img src="clients/logo1.png" height="32">
      <img src="clients/logo2.png" height="32">
    </p>
    <h2>Contact</h2>
    <p><img src="assets/email-address.png"></p>
    <img src="assets/spacer.gif" width="1" height="40">
  </main>
</body>
</html>
