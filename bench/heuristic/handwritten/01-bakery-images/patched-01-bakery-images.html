<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Crumb &amp; Co. Bakery</title>
  <style>
    body { font-family: Georgia, serif; margin: 0; color: #222; }
    header, main, footer { padding: 1rem 2rem; }
    .products { display: flex; gap: 1rem; }
    .divider { display: block; margin: 2rem auto; }
  </style>
</head>
<body>
  <header>
    <a href="/"><img src="img/crumb-logo.svg" width="120"></a>
    <nav>
      <a href="/menu">Menu</a>
      <a href="/order">Order online</a>
    </nav>
  </header>
  <main>
    <h1>Fresh every morning</h1>
    <p>Our sourdough is fermented for 36 hours.</p>
    <section class="products">
      <figure>
        <img src="img/sourdough.jpg" width="200">
        <figcaption>Country sourdough, 800 g, 6.50 EUR</figcaption>
      </figure>
      <figure>
        <img src="img/croissant.jpg" width="200">
        <figcaption>Butter croissant, 1.90 EUR</figcaption>
      </figure>
    </section>
    <img class="divider" src="img/wheat-divider.png" width="300">
    <h2>Opening hours</h2>
    <img src="img/hours-table.png" width="400">
    <p>Call us at 555-0134 to place a large order.</p>
    <p>
      <a href="https://maps.example.com/crumb"><img src="img/map-pin.png" width="16"> Find us on the map</a>
    </p>
  </main>
  <footer>
    <a href="https://social.example.com/crumb"><img src="img/social-icon.png" width="24"></a>
    <p>&copy; 2025 Crumb &amp; Co.</p>
  </footer>
</body>
</html>
