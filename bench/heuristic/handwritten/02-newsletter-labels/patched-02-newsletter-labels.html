<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Subscribe to the Field Notes newsletter</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; color: #1a1a1a; }
    .row { margin: 0.75rem 0; }
    .hint { font-size: 0.9rem; color: #555; }
  </style>
</head>
<body>
  <main>
    <h1>Field Notes</h1>
    <p>A monthly letter about birds, weather and the garden.</p>
    <form action="/subscribe" method="post">
      <div class="row">
        <input type="email" name="email" placeholder="you@example.com">
      </div>
      <div class="row">
        Full name
        <input type="text" name="fullname" aria-label="Fullname">
      </div>
      <div class="row">
        <span>Country</span>
        <select name="country">
          <option>Spain</option>
          <option>Portugal</option>
          <option>France</option>
        </select>
      </div>
      <div class="row">
        <input type="checkbox" name="weekly" value="yes" aria-label="Weekly"> Send me the weekly digest too
      </div>
      <div class="row">
        <p class="hint">Anything you would like us to write about?</p>
        <textarea name="topics" rows="3" aria-label="Topics"></textarea>
      </div>
      <button type="submit">Subscribe</button>
    </form>
    <form action="/search" role="search">
      <input type="search" name="q">
      <button type="submit">Search the archive</button>
    </form>
  </main>
</body>
</html>
