# Example workflow: copy to .github/workflows/verifa11y.yml in your repository.
# Docs: https://github.com/mateogsilvaa/verifa11y/blob/main/docs/github-action.md
name: accessibility

on:
  pull_request:
    paths: ["**/*.html", "**/*.htm"]

# Read the pull request, post one review. Nothing else.
permissions:
  contents: read
  pull-requests: write

jobs:
  verifa11y:
    runs-on: ubuntu-latest
    steps:
      # The pull request head, not the merge commit: suggestions point at the head's lines.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No release is tagged yet: pin a full commit SHA of mateogsilvaa/verifa11y.
      - uses: mateogsilvaa/verifa11y@COMMIT_SHA
        id: verifa11y
        with:
          mode: codemod # deterministic fixes only, no model, no secrets
          fail-on: none # or: findings, unfixed

      # The combined `git apply` patch and every result, for whoever reviews the pull request.
      - uses: actions/upload-artifact@v4
        if: always() && steps.verifa11y.outputs.results != ''
        with:
          name: verifa11y
          path: |
            ${{ steps.verifa11y.outputs.patch }}
            ${{ steps.verifa11y.outputs.results }}
