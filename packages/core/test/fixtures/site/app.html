<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>App</title>
<script src="https://cdn.example.invalid/widget.js"></script>
</head>
<body>
<main id="app"><h1>App</h1><p>Loading…</p></main>
<script>
  fetch("/data.json").then((r) => r.json()).then((d) => {
    setTimeout(() => {
      document.querySelector("#app p").textContent = d.title;
      const img = document.createElement("img");
      img.src = "/chart.png";
      document.querySelector("#app").append(img);
    }, 200);
  });
</script>
</body>
</html>
